<header class="site-header">
  <div class="inner">
    <a class="brand" [routerLink]="localeUrl.localize('/')" (click)="closeMenu()">
      <span class="brand-icon" aria-hidden="true">
        <app-icon name="BookOpenCheck" [size]="22" />
      </span>
      <span class="brand-text">
        <span class="wordmark">Miraath Guide</span>
        <span class="tagline">{{ i18n.t('brand.tagline') }}</span>
      </span>
    </a>

    <nav class="nav-desktop" [attr.aria-label]="i18n.t('nav.primary')">
      @for (link of navLinks; track link.path) {
        <a
          [routerLink]="localeUrl.localize(link.path)"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: false }"
          ariaCurrentWhenActive="page"
        >
          {{ i18n.t(link.labelKey) }}
        </a>
      }
    </nav>

    <div class="actions">
      <app-language-switcher class="lang-switcher" />
      <app-primary-button [routerLink]="localeUrl.localize('/calculator/wizard')" [showArrow]="false" class="start-btn">
        {{ i18n.t('nav.startCalculation') }}
      </app-primary-button>
      <button
        type="button"
        class="menu-toggle"
        (click)="toggleMenu()"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="mobile-nav"
        [attr.aria-label]="i18n.t('nav.toggle')"
      >
        <app-icon [name]="menuOpen() ? 'X' : 'Menu'" [size]="22" />
      </button>
    </div>
  </div>

  @if (menuOpen()) {
    <nav id="mobile-nav" class="nav-mobile" [attr.aria-label]="i18n.t('nav.primaryMobile')">
      @for (link of navLinks; track link.path) {
        <a [routerLink]="localeUrl.localize(link.path)" routerLinkActive="active" (click)="closeMenu()">{{ i18n.t(link.labelKey) }}</a>
      }
      <app-language-switcher />
      <app-primary-button [routerLink]="localeUrl.localize('/calculator/wizard')" [fullWidth]="true" (click)="closeMenu()">
        {{ i18n.t('nav.startCalculation') }}
      </app-primary-button>
    </nav>
  }
</header>
