<nav class="wizard-progress" [attr.aria-label]="i18n.t('wizard.progressAria')">
  <ol class="sections">
    @for (section of sections; track section) {
      @if (section !== 'review') {
        <li [class]="sectionState(section)" [attr.aria-current]="sectionState(section) === 'active' ? 'step' : null">
          <span class="dot">
            @if (sectionState(section) === 'done') {
              <app-icon name="Check" [size]="14" />
            } @else {
              <app-icon [name]="sectionIcons[section]" [size]="14" />
            }
          </span>
          <span class="section-label">{{ sectionLabel(section) }}</span>
        </li>
      }
    }
  </ol>
  <div class="bar-track">
    <div class="bar-fill" [style.width.%]="percent()"></div>
  </div>
  <p class="current-section-label">{{ sectionLabel(currentSection()) }}</p>
</nav>
